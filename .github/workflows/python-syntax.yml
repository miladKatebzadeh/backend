name: Python syntax guard

on:
  pull_request:
  push:
    branches: [master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Django source
        run: python -m compileall -q apps config manage.py
